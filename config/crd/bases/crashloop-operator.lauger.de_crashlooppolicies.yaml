apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: crashlooppolicies.crashloop-operator.lauger.de
spec:
  group: crashloop-operator.lauger.de
  names:
    kind: CrashLoopPolicy
    listKind: CrashLoopPolicyList
    plural: crashlooppolicies
    shortNames:
    - clp
    singular: crashlooppolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.scaledDownWorkloads
      name: Scaled Down
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CrashLoopPolicy is the Schema for the crashlooppolicies API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CrashLoopPolicySpec defines the policy for scaling down failing
              workloads.
            properties:
              allReplicasFailing:
                default: true
                description: |-
                  AllReplicasFailing requires all replicas to be failing before action.
                  This is a pointer so that an explicit false is distinguishable from
                  the field being unset.
                type: boolean
              dryRun:
                default: false
                description: DryRun logs actions without executing them.
                type: boolean
              durationThreshold:
                default: 30m
                description: |-
                  DurationThreshold is how long a pod must be failing before action (e.g. "30m").
                  Accepts a Go duration: one or more number+unit pairs, where the unit is
                  ns, us, ms, s, m or h. The non-ASCII spellings of microseconds that Go
                  also accepts are deliberately not permitted.
                pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                type: string
              excludeNamespaces:
                default:
                - kube-system
                - kube-public
                - kube-node-lease
                description: ExcludeNamespaces lists namespaces to ignore (applied
                  after namespaceSelector).
                items:
                  type: string
                type: array
              excludeWorkloadSelector:
                description: |-
                  ExcludeWorkloadSelector selects workloads by labels to exclude from
                  scale-down actions. If set, workloads matching these labels are skipped.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              failureCorrelation:
                default: Pod
                description: |-
                  FailureCorrelation controls how AllReplicasFailing compares replicas.

                  Pod, the default, requires every replica to be failing in some way.
                  Container additionally requires the same container name to be the
                  failing one in every replica, which distinguishes a systematic problem
                  such as a bad image or a missing Secret from unrelated failures that
                  happen to coincide. It is the stricter setting and acts in fewer
                  situations.

                  Has no effect when AllReplicasFailing is false.
                enum:
                - Pod
                - Container
                type: string
              namespaceSelector:
                description: |-
                  NamespaceSelector selects namespaces by labels. If set, only pods in
                  matching namespaces are evaluated. If empty, all namespaces are watched
                  (subject to excludeNamespaces).
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              reconcileInterval:
                default: 60s
                description: |-
                  ReconcileInterval is how often the policy is evaluated (e.g. "60s", "5m").
                  Defaults to "60s" if not set. Same duration format as DurationThreshold.
                pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                type: string
              restartThreshold:
                default: 10
                description: RestartThreshold is the number of container restarts
                  before action.
                format: int32
                minimum: 1
                type: integer
              restartWindow:
                default: 1h
                description: |-
                  RestartWindow bounds how recently the last termination must have
                  happened for WatchTerminationReasons to match. Without it the check
                  would act on a lifetime restart counter that never decays, so a
                  workload that misbehaved last month would still be scaled down.
                pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                type: string
              targets:
                default:
                - Deployment
                - StatefulSet
                - CronJob
                description: Targets lists workload types to act on.
                items:
                  enum:
                  - Deployment
                  - StatefulSet
                  - CronJob
                  type: string
                type: array
              watchReasons:
                default:
                - CrashLoopBackOff
                - ImagePullBackOff
                - ErrImagePull
                - CreateContainerConfigError
                - InvalidImageName
                - RunContainerError
                description: WatchReasons lists container waiting reasons to watch.
                items:
                  type: string
                type: array
              watchTerminationReasons:
                description: |-
                  WatchTerminationReasons lists container termination reasons to act on,
                  for containers that restart repeatedly without ever settling into a
                  watched waiting state. Kubelet forgets its restart backoff once a
                  container has stayed up long enough, so a container that dies every
                  fifteen minutes restarts immediately every time and never enters
                  CrashLoopBackOff, which makes it invisible to WatchReasons.

                  Empty by default, which leaves behaviour unchanged. "OOMKilled" is the
                  safe value to start with. "Error" also works but is broad: it covers
                  ordinary crashes, liveness kills and SIGKILL after the grace period
                  alike.

                  A match additionally requires RestartThreshold to be reached and the
                  most recent termination to fall inside RestartWindow.
                items:
                  type: string
                type: array
            type: object
          status:
            description: CrashLoopPolicyStatus defines the observed state of CrashLoopPolicy.
            properties:
              activeScaledDown:
                description: |-
                  ActiveScaledDown lists workloads currently scaled down by this policy.
                  Updated each evaluation cycle. The list is capped so that a cluster-wide
                  policy cannot grow the object past the etcd size limit; see
                  ActiveScaledDownTruncated.
                items:
                  description: |-
                    ScaledDownWorkloadRef identifies a workload currently held at zero replicas
                    (or suspended, for CronJobs) by this policy.
                  properties:
                    kind:
                      description: |-
                        Kind of the workload, for example Deployment, StatefulSet or CronJob.
                        Deliberately not constrained by an enum: this is a status field, and the
                        API server validates status writes, so a value outside the list would
                        reject the entire status update rather than just this entry. Validate
                        what users write, describe what the controller reports.
                      type: string
                    name:
                      description: Name of the workload.
                      type: string
                    namespace:
                      description: Namespace of the workload.
                      type: string
                  required:
                  - kind
                  - name
                  - namespace
                  type: object
                maxItems: 1000
                type: array
                x-kubernetes-list-type: atomic
              activeScaledDownTruncated:
                description: |-
                  ActiveScaledDownTruncated is the number of currently scaled-down
                  workloads omitted from ActiveScaledDown because the list hit its cap.
                format: int32
                type: integer
              conditions:
                description: Conditions represent the latest available observations
                  of the policy's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastEvaluationTime:
                description: LastEvaluationTime is the last time the policy was evaluated.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the spec that
                  was last evaluated.
                format: int64
                type: integer
              phase:
                description: Phase is the current phase of the policy.
                enum:
                - Pending
                - Active
                type: string
              scaledDownWorkloads:
                description: ScaledDownWorkloads tracks the total number of scale-down
                  actions performed (lifetime counter).
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
