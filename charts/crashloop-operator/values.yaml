# -- Number of operator replicas. Leader election makes only one of them active.
replicaCount: 1

image:
  # -- Operator image repository.
  repository: ghcr.io/slauger/crashloop-operator
  # -- Image tag. Defaults to the chart appVersion, which pins each chart
  # release to the operator build it was tested with.
  tag: ""
  # -- Image digest. Takes precedence over tag when set, for example
  # `sha256:abc...`.
  digest: ""
  # -- Image pull policy. IfNotPresent is safe now that the default tag is the
  # immutable appVersion rather than a floating latest.
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries.
imagePullSecrets: []

# -- Override the chart name used in resource names.
nameOverride: ""

# -- Override the full resource name prefix.
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount for the operator.
  create: true
  # -- Name of the ServiceAccount. Generated from the release name when empty.
  name: ""
  # -- Annotations to add to the ServiceAccount.
  annotations: {}

# -- Enable leader election so that only one replica reconciles at a time.
leaderElect: true

scope:
  # -- Operator scope. `cluster` watches all namespaces via ClusterRole.
  # `namespace` confines workload access to a single namespace via Role.
  # CrashLoopPolicy itself is cluster-scoped either way, so policy access is
  # always granted through a ClusterRole.
  mode: cluster
  # -- Namespace to watch when mode is `namespace`. Defaults to the release
  # namespace when empty.
  watchNamespace: ""

# -- Annotations to add to the operator pod.
podAnnotations: {}

# -- Extra labels to add to the operator pod.
podLabels: {}

# -- Mount the ServiceAccount token. The operator talks to the API server, so
# it needs this; the value exists for policies that require it to be explicit.
automountServiceAccountToken: true

# -- PriorityClass for the operator pod.
priorityClassName: ""

# -- How many old ReplicaSets to retain for the operator Deployment.
revisionHistoryLimit: 3

# -- Extra command line arguments for the operator.
extraArgs: []

# -- Extra environment variables for the operator container.
extraEnv: []

# -- Topology spread constraints for the operator pod.
topologySpreadConstraints: []

podDisruptionBudget:
  # -- Create a PodDisruptionBudget. Only meaningful with replicaCount above 1,
  # since leader election already keeps a single replica from being active
  # twice.
  enabled: false
  # -- Minimum available pods. Mutually exclusive with maxUnavailable.
  minAvailable: 1
  # -- Maximum unavailable pods. Mutually exclusive with minAvailable.
  maxUnavailable: ""

metrics:
  service:
    # -- Expose the controller-runtime metrics endpoint through a Service.
    enabled: false
    # -- Service port for metrics.
    port: 8080
    # -- Annotations to add to the metrics Service.
    annotations: {}
  serviceMonitor:
    # -- Create a Prometheus Operator ServiceMonitor. Requires
    # metrics.service.enabled and the monitoring.coreos.com CRDs.
    enabled: false
    # -- Scrape interval.
    interval: 30s
    # -- Extra labels for the ServiceMonitor, for Prometheus selector matching.
    labels: {}

networkPolicy:
  # -- Create a NetworkPolicy for the operator pod. Requires an API server CIDR.
  enabled: false
  apiServer:
    ipBlock:
      # -- CIDR containing the Kubernetes API server endpoint. Required when the policy is enabled.
      cidr: ""
      # -- CIDRs to exclude from the API server CIDR.
      except: []
    # -- Kubernetes API server port.
    port: 443
  dns:
    # -- Namespace selector for the cluster DNS pods.
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    # -- Pod selector for the cluster DNS pods.
    podSelector:
      matchLabels:
        k8s-app: kube-dns

# -- Resource requests and limits for the operator container.
resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# -- Node selector for the operator pod.
nodeSelector: {}

# -- Tolerations for the operator pod.
tolerations: []

# -- Affinity rules for the operator pod.
affinity: {}
