suite: RBAC tests
templates:
  - templates/clusterrole.yaml
  - templates/clusterrolebinding.yaml
tests:
  # Document 0 covers the cluster-scoped CrashLoopPolicy and namespaces.
  # Document 1 covers workloads and follows scope.mode.
  - it: should grant policy access via ClusterRole in cluster mode
    template: templates/clusterrole.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: ClusterRole
      - isNull:
          path: metadata.namespace

  - it: should grant policy access via ClusterRole even in namespace mode
    template: templates/clusterrole.yaml
    documentIndex: 0
    set:
      scope:
        mode: namespace
    asserts:
      - isKind:
          of: ClusterRole
      - isNull:
          path: metadata.namespace

  - it: should bind policy ClusterRole cluster-wide in namespace mode
    template: templates/clusterrolebinding.yaml
    documentIndex: 0
    set:
      scope:
        mode: namespace
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - isNull:
          path: metadata.namespace
      - equal:
          path: roleRef.kind
          value: ClusterRole

  - it: should create workload ClusterRole in cluster mode
    template: templates/clusterrole.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: ClusterRole
      - isNull:
          path: metadata.namespace
      - equal:
          path: metadata.name
          value: RELEASE-NAME-crashloop-operator-workloads

  - it: should create workload ClusterRoleBinding in cluster mode
    template: templates/clusterrolebinding.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - isNull:
          path: metadata.namespace

  - it: should create workload Role in namespace mode
    template: templates/clusterrole.yaml
    documentIndex: 1
    set:
      scope:
        mode: namespace
    asserts:
      - isKind:
          of: Role
      - isNotNull:
          path: metadata.namespace

  - it: should create workload RoleBinding in namespace mode
    template: templates/clusterrolebinding.yaml
    documentIndex: 1
    set:
      scope:
        mode: namespace
    asserts:
      - isKind:
          of: RoleBinding
      - isNotNull:
          path: metadata.namespace
      - equal:
          path: roleRef.kind
          value: Role

  - it: should use custom watchNamespace for the workload Role
    template: templates/clusterrole.yaml
    documentIndex: 1
    set:
      scope:
        mode: namespace
        watchNamespace: custom-ns
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-ns

  - it: should grant CRD permissions
    template: templates/clusterrole.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["crashloop-operator.lauger.de"]
            resources: ["crashlooppolicies"]
            verbs: ["get", "list", "watch", "update", "patch"]

  - it: should grant event permissions cluster-wide
    template: templates/clusterrole.yaml
    documentIndex: 0
    set:
      scope:
        mode: namespace
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["", "events.k8s.io"]
            resources: ["events"]
            verbs: ["create", "patch"]

  - it: should grant pod read permissions
    template: templates/clusterrole.yaml
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods"]
            verbs: ["get", "list", "watch"]

  - it: should grant deployment write permissions
    template: templates/clusterrole.yaml
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["deployments"]
            verbs: ["get", "list", "watch", "update", "patch"]

  - it: should grant lease permissions for leader election
    template: templates/clusterrole.yaml
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["coordination.k8s.io"]
            resources: ["leases"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - it: should reference correct ServiceAccount
    template: templates/clusterrolebinding.yaml
    documentIndex: 0
    release:
      namespace: my-ns
    asserts:
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: RELEASE-NAME-crashloop-operator
            namespace: my-ns
