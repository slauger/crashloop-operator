name: E2E

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - CHANGELOG*
      - .github/*.md
  push:
    branches: [develop]
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - CHANGELOG*
      - .github/*.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chainsaw:
    name: Chainsaw on kind
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          cluster_name: crashloop-e2e
          config: tests/e2e/kind-config.yaml

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5

      - name: Build, load and install the operator
        run: make e2e-deploy
        env:
          CONTAINER_TOOL: docker

      - name: Run chainsaw tests
        run: make e2e-run

      - name: Dump operator logs on failure
        if: failure()
        run: |
          kubectl -n crashloop-system get pods -o wide || true
          kubectl -n crashloop-system logs -l app.kubernetes.io/name=crashloop-operator --tail=200 || true
          kubectl get crashlooppolicies -o yaml || true
